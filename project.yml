name: FuriganaLens
options:
  bundleIdPrefix: com.furiganalens
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  FuriganaLens:
    type: application
    platform: iOS
    sources:
      - path: FuriganaLens
        excludes:
          - "**/.DS_Store"
    resources:
      - path: FuriganaLens/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furiganalens.app
        INFOPLIST_KEY_NSCameraUsageDescription: "Point your camera at Japanese text on your TV or screen to read words and furigana."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

  FuriganaLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FuriganaLensTests
        excludes:
          - "**/.DS_Store"
          - "Fixtures"
    resources:
      - path: FuriganaLensTests/Fixtures
    dependencies:
      - target: FuriganaLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furiganalens.app.tests
        GENERATE_INFOPLIST_FILE: YES

  FuriganaLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FuriganaLensUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FuriganaLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furiganalens.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FuriganaLens
schemes:
  FuriganaLens:
    build:
      targets:
        FuriganaLens: all
        FuriganaLensTests: [test]
        FuriganaLensUITests: [test]
    test:
      targets:
        - FuriganaLensTests
        - FuriganaLensUITests
