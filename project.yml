name: KanjiCrush
options:
  bundleIdPrefix: com.kanjicrush
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  developmentLanguage: en
knownRegions:
  - en
  - ja
  - Base
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  KanjiCrush:
    type: application
    platform: iOS
    sources:
      - path: KanjiCrush
        excludes:
          - "**/.DS_Store"
    resources:
      - path: KanjiCrush/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanjicrush.app
        INFOPLIST_KEY_CFBundleDisplayName: "Kanji Crush"
        INFOPLIST_KEY_NSCameraUsageDescription: "Point your camera at Japanese text on your TV or screen to read words and furigana."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

  KanjiCrushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KanjiCrushTests
        excludes:
          - "**/.DS_Store"
          - "Fixtures"
    resources:
      - path: KanjiCrushTests/Fixtures
    dependencies:
      - target: KanjiCrush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanjicrush.app.tests
        GENERATE_INFOPLIST_FILE: YES

  KanjiCrushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KanjiCrushUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: KanjiCrush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanjicrush.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KanjiCrush
schemes:
  KanjiCrush:
    build:
      targets:
        KanjiCrush: all
        KanjiCrushTests: [test]
        KanjiCrushUITests: [test]
    test:
      targets:
        - KanjiCrushTests
        - KanjiCrushUITests
